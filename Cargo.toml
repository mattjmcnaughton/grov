[package]
name = "grov"
version = "0.1.0"
edition = "2024"

[features]
default = []
integration-tests = []

[dependencies]
anyhow = "1"
bollard = "0.18"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
directories = "6"
fs2 = "0.4"
minijinja = "2"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio-test = "0.4"
